[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-doctor"
version = "0.1.0"
description = "Audit Dockerfiles: root user, unpinned bases, secrets in build args, cache-busting layers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["docker", "devops", "linter", "containers", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/docker-doctor"

[project.scripts]
docker-doctor = "dockerdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["dockerdoctor*"]
